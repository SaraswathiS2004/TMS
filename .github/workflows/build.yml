name: Build and Release

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Cache Node.js (frontend-maven-plugin)
        uses: actions/cache@v4
        with:
          path: client/node
          key: ${{ runner.os }}-node-${{ hashFiles('client/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      # On main push: build WAR and upload as artifact
      - name: Build WAR
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: mvn --batch-mode clean package -DskipTests -s .github/maven-settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Upload WAR artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Tms-war
          path: target/Tms.war
          retention-days: 90

      # On version tag push: set version, publish WAR to GitHub Packages + create GitHub Release
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn --batch-mode versions:set -DnewVersion=${GITHUB_REF_NAME#v} -s .github/maven-settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Build and publish WAR
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn --batch-mode clean deploy -DskipTests -s .github/maven-settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/Tms.war
          generate_release_notes: true
