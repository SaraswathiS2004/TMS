<nav class="navbar">
  <div class="nav-brand">
    <i class="bi bi-stars nav-brand-icon"></i>
    <span class="nav-title">{{ 'app.title' | translate }}</span>
  </div>

  <div class="nav-links">
    <div class="inv-menu-wrapper">
      <button
        class="inv-menu-trigger"
        [class.inv-menu-open]="showInvMenu"
        (click)="toggleInvMenu()"
      >
        <i class="bi bi-journal-bookmark-fill"></i>
        {{ 'nav.invitationManager' | translate }}
        <i class="bi" [ngClass]="showInvMenu ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
      </button>

      <div class="inv-menu-panel" *ngIf="showInvMenu">
        <a routerLink="/dashboard" routerLinkActive="active-link" (click)="showInvMenu = false">
          <i class="bi bi-speedometer2"></i>
          {{ 'nav.dashboard' | translate }}
        </a>
        <a routerLink="/add" routerLinkActive="active-link" (click)="showInvMenu = false">
          <i class="bi bi-person-plus"></i>
          {{ 'nav.addPerson' | translate }}
        </a>
        <a routerLink="/list" routerLinkActive="active-link" (click)="showInvMenu = false">
          <i class="bi bi-people"></i>
          {{ 'nav.peopleList' | translate }}
        </a>
        <a routerLink="/city-group" routerLinkActive="active-link" (click)="showInvMenu = false">
          <i class="bi bi-geo-alt"></i>
          {{ 'nav.byCity' | translate }}
        </a>
        <a routerLink="/functions" routerLinkActive="active-link" (click)="showInvMenu = false">
          <i class="bi bi-calendar2-event"></i>
          {{ 'nav.manageFunctions' | translate }}
        </a>
      </div>
    </div>
  </div>

  <div class="nav-actions">
    <a routerLink="/admin" class="admin-link" title="Admin Settings">
      <i class="bi bi-gear-fill"></i>
      <span class="sync-dot sync-fail" *ngIf="showSyncWarning" title="Sheet sync failed"></span>
    </a>
    <button class="lang-toggle" (click)="toggleLanguage()" [title]="'common.language' | translate">
      <i class="bi bi-translate"></i>
      <span>{{ isTamil ? 'English' : 'தமிழ்' }}</span>
    </button>
  </div>
</nav>

<div class="sync-warning-banner" *ngIf="showSyncWarning">
  <i class="bi bi-exclamation-triangle-fill"></i>
  Google Sheets sync failed: {{ syncStatus?.lastSyncError }}
  <a routerLink="/admin">Check Admin Settings</a>
</div>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
